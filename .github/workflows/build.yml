   name: Build APK
   on: [push]
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: setup java
           uses: actions/setup-java@v4
           with:
             distribution: 'temurin'
             java-version: '17'
         - name: build apk
           run: |
             chmod +x gradlew
             ./gradlew assembleDebug
         - name: upload apk
           uses: actions/upload-artifact@v4
           with:
             name: app-debug
             path: app/build/outputs/apk/debug/app-debug.apk
